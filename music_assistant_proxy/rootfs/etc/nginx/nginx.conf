worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/2 info;

events {
    worker_connections 1024;
}

http {
    access_log /proc/1/fd/1 combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8095 default_server;
        
        location / {
            proxy_pass http://${SERVER_HOST}:${SERVER_PORT};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Optioneel: authenticeer bij Music Assistant met een langlevende token,
            # zodat er geen loginscherm verschijnt achter Home Assistant Ingress.
            # Leeg = geen header (nginx laat een lege Authorization automatisch weg).
            proxy_set_header Authorization "${MA_AUTH_VALUE}";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
        }
    }
}
