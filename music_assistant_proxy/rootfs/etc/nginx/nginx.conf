worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/2 info;

events {
    worker_connections 1024;
}

http {
    access_log /proc/1/fd/1 combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8095 default_server;
        
        location / {
            proxy_pass http://${SERVER_HOST}:${SERVER_PORT};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Home Assistant Ingress-headers doorzetten zodat Music Assistant
            # de gebruiker automatisch herkent en niet elke keer om een login vraagt.
            # (Ontbrekende headers worden door nginx niet doorgestuurd, dus veilig.)
            proxy_set_header X-Ingress-Path $http_x_ingress_path;
            proxy_set_header X-Remote-User-Id $http_x_remote_user_id;
            proxy_set_header X-Remote-User-Name $http_x_remote_user_name;
            proxy_set_header X-Remote-User-Display-Name $http_x_remote_user_display_name;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
        }
    }
}
