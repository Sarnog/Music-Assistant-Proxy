worker_processes 1;
pid /var/run/nginx.pid;
error_log /proc/1/fd/2 info;

events {
    worker_connections 1024;
}

http {
    access_log /proc/1/fd/1 combined;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8095 default_server;

        # The WebSocket goes through the Python auth bridge, which authenticates
        # the Music Assistant connection with the token so the frontend is
        # logged in automatically behind Home Assistant Ingress.
        location = /ws {
            proxy_pass http://127.0.0.1:8096;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Everything else (frontend, assets, images, audio streams, REST API)
        # goes straight to Music Assistant.
        location / {
            proxy_pass http://${SERVER_HOST}:${SERVER_PORT};
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Authenticate REST requests with the long-lived token (the WebSocket
            # login is handled by the auth bridge above). Empty = no header
            # (nginx drops an empty Authorization automatically).
            proxy_set_header Authorization "${MA_AUTH_VALUE}";

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_http_version 1.1;
        }
    }
}
